# finiteJest — collection parameters. Everything here is a default; CLI flags win.

[general]
budget_gib    = 10       # hard ceiling on downloaded media
target_count  = 100      # stop after N videos
max_attempts  = 3
min_duration_s = 3
max_duration_s = 300     # hard cap: nothing over 5 minutes gets in

[video]
# 1080p h264/aac when offered (remuxes to mp4 without re-encoding), else best ≤1080p
format = "bv*[height<=1080][vcodec^=avc1]+ba[acodec^=mp4a]/bv*[height<=1080]+ba/b[height<=1080]/b"
merge  = "mp4"
max_height = 1080
max_file_mib = 800
thumbs = false
# cookies_from_browser = "firefox"   # uncomment if a site demands a login

[reddit]
# Create a free "script" app at https://www.reddit.com/prefs/apps
# (redirect uri can be left blank) and paste the two values below.
client_id = ""
client_secret = ""
user_agent = "linux:finitejest:0.1 (personal video archive)"
min_score = 25
subreddits = ["DeepIntoYoutube"]

[fourchan]
boards = ["wsg"]        # default board(s); wsg = worksafe webms, per its own banner
threads = 12            # threads scanned per harvest (1 request/second)
min_replies = 0

[booru]
# Cloudflare-walled boorus (soybooru, danbooru, rule34) refuse non-browser
# clients. If you have a live session, paste the raw Cookie header here.
cookie = ""

[paths]
videos  = "data/videos"
meta    = "data/meta"
exports = "collection"
db      = "data/finitejest.db"
